# Plugins (installed by TPM, see bottom of file)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'Nybkox/tmux-kanagawa'

# Kanagawa theme
set -g @kanagawa-plugins "time"
set -g @kanagawa-network-bandwidth-show-interface false
set -g @kanagawa-day-month true
set -g @kanagawa-military-time true
set -g @kanagawa-show-timezone false

# Terminal / truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on

# Vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# On WSL, also copy to the Windows clipboard
if-shell "command -v clip.exe" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip.exe'"

# Status bar (note: kanagawa overrides status-right when it loads)
set -g status-interval 5
set -g status-right-length 80
set -g status-right '#(tmux list-sessions \
    -F "#{session_name}#{?session_attached,*,}" \
    | tr "\n" " " )'

# Bootstrap TPM + plugins on a fresh machine, then load them
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# Russian layout: mirror bindings onto Cyrillic keys (must run after TPM)
run '~/.tmux/scripts/cyrillic-keys.sh'
